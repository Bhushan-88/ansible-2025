- name: register example
  hosts: all

  tasks:

    - name: get hostname
      shell: hostname
      register: hostname_result
      ignore_errors: yes

    - name: print hostname
      debug:
        msg: "The hostname is {{ hostname_result.stdout }}"

# anather example
- name: Register example
  hosts: all
  tasks:
    - name: Check current user
      command: whoami
      register: user_output

    - name: Show output
      debug:
        var: user_output.stdout

