- name: my web server setup
  hosts: all
  become: yes
  ignore_errors: yes
  tasks:
    - name: install httpd package
      package:
        name: httpd
        state: present
      when: ansible_os_family == "RedHat"
    - name: start httpd 
      systemd:
        name: httpd
        state: started
        enabled: yes
      when: ansible_os_family == "RedHat"

    - name: install apache2 package
      package:
        name: apache2
        state: present
      when: ansible_os_family == "Debian"
    - name: start apache2 
      systemd:
        name: apache2
        state: started
        enabled: yes
      when: ansible_os_family == "Debian"
