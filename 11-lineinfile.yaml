---
- name: Add a line to file
  hosts: all
  become: yes
  tasks:
    - name: Add text to file
      lineinfile:
        path: /mnt/demo.txt
        line: "This line is managed by Ansible"
        create: yes
        state: present

    - name: Verify the line was added
      command: cat /mnt/demo.txt
      register: cat_output

    - name: Show the file content
      debug:
        msg: "{{ cat_output.stdout }}"


    - name: line in file with install package
      lineinfile:
        path: /var/www/html/index.html
        line: "<h1>Welcome to Ansible Managed Page</h1>"
        regexp: '^<h1>.*</h1>$'
