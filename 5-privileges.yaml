- name: privilege escalation example
  hosts: all
  become: yes  # <-- This makes everything run as root
  tasks:
    - name: insall httpd package
      yum:
        name: httpd
        state: present
      when: ansible_os_family == "RedHat"

    - name: install apache2 package
      apt:
        name: apache2
        state: present
      when: ansible_os_family == "Debian"

    - name: Edit file (needs root)
      lineinfile:
        path: /mnt/file.txt
        create: yes
        line: "192.168.1.10 myserver"
      become: yes  # <-- Only this task as root