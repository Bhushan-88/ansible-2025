- name: my web server
  hosts: all
  become: yes

  tasks:
    - name: Ensure web server is installed
      package:
        name: httpd
        state: present
        tags: install
    - name: Ensure web server is started and enabled
      service:
        name: httpd
        state: started
        enabled: yes
        tags: start

    - name: deploy index.html to web server
      copy:
        src: index.html
        dest: /var/www/html/index.html
        tags: deploy
