- name: install openjdk-8-jdk
  package:
    name: openjdk-8-jdk
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: download and extract tomcat file
  unarchive:
    src: "{{ URL }}"
    dest: "/opt/"
    remote_src: yes
  tags: install-tomcat
  when: ansible_facts['os_family'] == "Debian"

- name: upload application daemon file
  copy:
    src: tomcat-init
    dest: /etc/init.d/tomcatd
    mode: '0755'
  when: ansible_facts['os_family'] == "Debian"

- name: start tomcat service
  systemd:
        daemon_reload: true
        name: tomcatd
        state: started
  notify: restart tomcatd
  when: ansible_os_family == "Debian"
  tags: start-tomcat

