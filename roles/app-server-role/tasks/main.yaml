- name: install java
  package:
    name: java
    state: present
  when: ansible_facts['os_family'] == "RedHat"

- name: install openjdk-21-jdk
  package:
    name: openjdk-8-jdk
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: download and extract application file
  unarchive:
    src: "{{ URL }}"
    dest: "/opt/"
    remote_src: yes

- name: start tomcat server
  shell: "/opt/{{ TOMCAT_DIR }}/bin/catalina.sh run"

- name: upload application daemon file
  copy:
    src: tomcat-init
    dest: /etc/init.d/tomcatd

- name: reload daemon
  systemd:
    daemon_reload: yes
    name: tomcatd
    state: started
    enabled: yes