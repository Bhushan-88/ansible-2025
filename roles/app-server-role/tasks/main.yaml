# advance way to download from url to destination
- name: student app deployment
  get_url:
    url: https://s3-us-west-2.amazonaws.com/studentapi-cit/student.war
    dest: "{{ WEB_APP_DIR }}/student.war"
  tags: deploy-app
  when: ansible_facts['os_family'] == "Debian"

- name: mysql connector deployment
  get_url:
    url: "{{ MYSQL_CONNECTOR_URL }}"
    dest: "/opt/{{ TOMCAT_DIR }}/lib/mysql-connector.jar"
  tags: mysql-connector
  when: ansible_facts['os_family'] == "RedHat"

- name: deploy context.xml
  template:
    src: context.xml.j2
    dest: "/opt/{{ TOMCAT_DIR }}/conf/context.xml"
  tags: deploy-context
  when: ansible_facts['os_family'] == "RedHat"
  notify: restart tomcatd

- name: install mariadb package
  package:
    name: mariadb-server
    state: present
  when: ansible_facts['os_family'] == "RedHat"